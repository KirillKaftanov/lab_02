[project]
name = "labs"
version = "0.1.0"
description = "Потоковый анализатор событий из CSV и JSONL с формированием JSON-отчета"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff==0.12.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
